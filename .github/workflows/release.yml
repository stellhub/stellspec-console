name: Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build executable jar
        run: mvn -B clean package

      - name: Assemble deployable zip
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            version="snapshot-${GITHUB_SHA::7}"
          fi
          zip_name="stellspec-console-${version}.zip"
          bundle_dir="target/deploy/stellspec-console"
          mkdir -p "${bundle_dir}"
          cp target/stellspec-console.jar "${bundle_dir}/stellspec-console.jar"
          cp src/main/resources/application.yaml "${bundle_dir}/application.yaml"
          cp src/main/resources/logback.xml "${bundle_dir}/logback.xml"
          cp README.md "${bundle_dir}/README.md"
          cd target/deploy
          zip -r "${zip_name}" stellspec-console
          echo "zip_path=target/deploy/${zip_name}" >> "${GITHUB_OUTPUT}"

      - name: Upload deployable zip
        uses: actions/upload-artifact@v4
        with:
          name: stellspec-console-deploy
          path: ${{ steps.bundle.outputs.zip_path }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: stellspec-console ${{ github.ref_name }}
          files: ${{ steps.bundle.outputs.zip_path }}
          generate_release_notes: true
